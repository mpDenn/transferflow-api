services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: transferflow
      POSTGRES_USER: transferflow
      POSTGRES_PASSWORD: transferflow_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "transferflow", "-d", "transferflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_USER: transferflow
      POSTGRES_PASSWORD: transferflow_dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: transferflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: